name: Simplified Release

on:
  push:
    tags:
      - 'v*'           # 统一版本格式: v1.0.0 / v1.0.0-beta.1 / v1.0.0-rc.1
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式（跳过 NPM 发布，只构建桌面应用）'
        required: false
        default: false
        type: boolean
      version:
        description: '版本号（测试模式时使用）'
        required: false
        default: '0.0.0-test'
        type: string

env:
  NODE_VERSION: '22.x'

permissions:
  contents: write
  packages: write

jobs:
  # 提取版本信息
  extract-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean-version: ${{ steps.version.outputs.clean-version }}
      is-beta: ${{ steps.version.outputs.is-beta }}
      publish-tag: ${{ steps.version.outputs.publish-tag }}
      test_mode: ${{ steps.version.outputs.test_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version information
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.test_mode }}" = "true" ]; then
            TEST_MODE="true"
            VERSION="${{ inputs.version }}"
            CLEAN_VERSION="${VERSION#v}"
            echo "test_mode=${TEST_MODE}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "clean-version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "is-beta=true" >> "$GITHUB_OUTPUT"
            echo "publish-tag=beta" >> "$GITHUB_OUTPUT"
          else
            TEST_MODE="false"
            TAG="${GITHUB_REF#refs/tags/}"
            CLEAN_VERSION="${TAG#v}"
            echo "test_mode=${TEST_MODE}" >> "$GITHUB_OUTPUT"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "clean-version=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

            IS_BETA=false
            case "$CLEAN_VERSION" in
              *-beta.*)  PUBLISH_TAG="beta";  IS_BETA=true ;;
              *-alpha.*) PUBLISH_TAG="alpha" ;;
              *-rc.*)    PUBLISH_TAG="rc" ;;
              *-dev.*)   PUBLISH_TAG="dev" ;;
              *-*)       echo "Unsupported pre-release tag format: ${TAG}"; exit 1 ;;
              *)         PUBLISH_TAG="latest" ;;
            esac

            echo "is-beta=${IS_BETA}" >> "$GITHUB_OUTPUT"
            echo "publish-tag=${PUBLISH_TAG}" >> "$GITHUB_OUTPUT"
          fi

  # 预发布检查
  pre-checks:
    runs-on: ubuntu-latest
    needs: extract-version
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Check and install all dependencies
        run: npm run check:deps

  # 发布到 NPM（预检 + 版本同步 + 发布统一走 scripts/release.sh）
  publish:
    runs-on: ubuntu-latest
    needs:
      - extract-version
      - pre-checks
    if: |
      needs.pre-checks.result == 'success' &&
      needs.extract-version.outputs.test_mode != 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: ./scripts/release.sh

      # 版本文件同步回 main（切回目标分支再提交，避免 detached HEAD 下 push HEAD:main）
      - name: Checkout main for version sync
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync version files on main
        run: node scripts/update-version.js ${{ needs.extract-version.outputs.clean-version }}

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: update version to ${{ needs.extract-version.outputs.version }}"
            git push origin main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.extract-version.outputs.version }}
          name: Release ${{ needs.extract-version.outputs.version }}
          body: |
            ## Release ${{ needs.extract-version.outputs.version }}

            ### 📦 Installation

            ```bash
            npm install @becrafter/prompt-manager@${{ needs.extract-version.outputs.publish-tag }}

            curl -fsSL 'http://iskill.site/scripts/installer/prompt-manager' | bash
            ```

            ### 📥 Desktop Applications

            **macOS**: Download the `.dmg` file and drag to Applications
            **Windows**: Download the `.exe` installer or portable `.zip` file
            **Linux**: Download the `.AppImage` or `.tar.xz` file

            ### 🧪 Testing

            If you encounter any issues, please report them at:
            https://github.com/BeCrafter/prompt-manager/issues
          prerelease: ${{ needs.extract-version.outputs.is_beta == 'true' || needs.extract-version.outputs.test_mode == 'true' }}

  # 桌面应用构建
  build-desktop:
    runs-on: ${{ matrix.os }}
    needs: [extract-version, pre-checks]
    if: needs.pre-checks.result == 'success'

    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check and install all dependencies
        run: npm run check:deps

      - name: Build admin-ui
        run: npm run build:admin-ui

      - name: Configure Electron mirror (optional override)
        run: |
          if [ -n "${ELECTRON_MIRROR_OVERRIDE:-}" ]; then
            echo "ELECTRON_MIRROR=${ELECTRON_MIRROR_OVERRIDE}" >> "$GITHUB_ENV"
          fi
        env:
          ELECTRON_MIRROR_OVERRIDE: ${{ vars.ELECTRON_MIRROR }}

      - name: Build desktop app
        run: npm run build:desktop:${{ matrix.platform }}
        working-directory: ./app/desktop

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.xz
          draft: false
          prerelease: ${{ needs.extract-version.outputs.is_beta == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布成功通知
  notify-success:
    runs-on: ubuntu-latest
    needs: [extract-version, publish, build-desktop]
    if: |
      always() &&
      (needs.publish.result == 'success' || needs.extract-version.outputs.test_mode == 'true')

    steps:
      - name: Success notification
        run: |
          if [ "${{ needs.extract-version.outputs.test_mode }}" = "true" ]; then
            echo "🧪 Test build completed successfully!"
            echo "📦 Version: ${{ needs.extract-version.outputs.version }}"
            echo "🔗 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.extract-version.outputs.version }}"
            echo ""
            echo "Download the desktop applications from the release page for testing."
          else
            echo "🎉 Release ${{ needs.extract-version.outputs.version }} completed successfully!"
            echo "📦 Published to NPM with tag: ${{ needs.extract-version.outputs.publish-tag }}"
            echo "🔗 GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.extract-version.outputs.version }}"
          fi
